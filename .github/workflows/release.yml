# Releases, asked for by the commit that should be released.
#
#   node tools/version.mjs --note "Help page" --apply
#   git commit -am "release: web 26.10.20.6 Help page"
#   git push                                     # to master
#
#   release: web        tests -> build -> the site on Cloudflare (wrangler.jsonc)
#   release: audio      tests -> the audio Worker (worker/media/wrangler.toml)
#   release: d1         tests -> reload track paths into D1 from media.json
#   release: web+audio  several targets, joined with +
#   release: all        web and audio
#   release: desktop    not set up yet; the plan stops with that reason
#
# Only the first line of the head commit of a push to master is read. With
# "Squash and merge" that is the pull request's title, so a pull request
# titled "release: web …" releases when it is merged; a merge commit
# ("Merge pull request #…") releases nothing. The same choice is on the
# Actions tab as "Run workflow". tools/release-plan.mjs reads the message and
# refuses a version that differs from package.json or has no CHANGELOG.md
# section; run it locally to see what a push would do.
#
# The build exists only inside this run: nothing built is committed. After a
# successful deploy the commit is tagged v<version> and a GitHub release is
# made from the CHANGELOG.md section. One-time setup: docs/releasing.md.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: What to release
        type: choice
        options: [web, audio, d1, web+audio, all]
        default: web

# One release at a time. A second release push waits rather than cancelling a
# release that may already be half published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # wrangler is fetched by npx for the deploy steps only; it is not a
  # dependency of the repository. One version for every step.
  WRANGLER: wrangler@4.151.2

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.plan.outputs.web }}
      audio: ${{ steps.plan.outputs.audio }}
      d1: ${{ steps.plan.outputs.d1 }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      message: ${{ steps.plan.outputs.message }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Values arrive through env, never pasted into the script, so a commit
      # message cannot run as shell.
      - id: plan
        name: Read the release plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TARGET: ${{ inputs.target }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::releases are made from master, not $REF"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node tools/release-plan.mjs --target "$TARGET"
          else
            node tools/release-plan.mjs
          fi

  test:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      gate: true

  # ---------------------------------------------------------------- web ----

  web:
    needs: [plan, test]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: web
    steps:
      - name: Require the Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::secrets not set:$missing; see docs/releasing.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Cloudflare's list of deployments shows the tag (the version) and the
      # message (the note from the release line, or the version).
      - name: Deploy the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ needs.plan.outputs.tag }}
          MESSAGE: ${{ needs.plan.outputs.message }}
        run: npx --yes "$WRANGLER" deploy --tag "$TAG" --message "$MESSAGE"
      # With the variable SITE_URL set, the live page must report this version
      # in its application-name meta. A version that is not live yet is
      # retried; a refusal (4xx) is not, because waiting cannot change it.
      # Cloudflare bot protection on a custom domain can answer GitHub's
      # machines with 403; the workers.dev address is not behind it.
      - name: Check the live version
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::variable SITE_URL is not set; the live version is not checked"
            exit 0
          fi
          url="${SITE_URL%/}/?release=$GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o page.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$url" || echo 000)
            case "$status" in
              200)
                live=$(sed -n 's/.*name="application-name" content="Zaideih" data-version="\([^"]*\)".*/\1/p' page.html)
                if [ "$live" = "$VERSION" ]; then
                  echo "$SITE_URL serves $VERSION"
                  exit 0
                fi
                echo "attempt $attempt: $SITE_URL serves '${live:-no version meta}', waiting for $VERSION" ;;
              4??)
                echo "::error::$SITE_URL answered HTTP $status, so the live version cannot be read from here. The deploy itself succeeded. A 403 is usually bot protection refusing GitHub's machines: set SITE_URL to the workers.dev address (docs/releasing.md)."
                exit 1 ;;
              *)
                echo "attempt $attempt: $SITE_URL answered HTTP $status" ;;
            esac
            sleep 10
          done
          echo "::error::$SITE_URL did not serve $VERSION within a minute (last answer: HTTP $status)"
          exit 1

  # -------------------------------------------------------------- audio ----

  audio:
    needs: [plan, test]
    if: needs.plan.outputs.audio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: audio
    steps:
      - name: Require the Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] || { echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set; see docs/releasing.md"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every migration is idempotent (CREATE ... IF NOT EXISTS) and runs on
      # each audio release, before the Worker that needs the tables goes live.
      - name: Apply the D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in worker/media/migrations/*.sql; do
            echo "applying $f"
            npx --yes "$WRANGLER" d1 execute audio --remote --yes --file "$f" --config worker/media/wrangler.toml
          done
      - name: Deploy the audio Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ needs.plan.outputs.tag }}
          MESSAGE: ${{ needs.plan.outputs.message }}
        run: npx --yes "$WRANGLER" deploy --config worker/media/wrangler.toml --tag "$TAG" --message "$MESSAGE"
      # The Worker must answer a ranged request for a known track with audio
      # and its diagnostic header. AUDIO_CHECK_URL overrides the address.
      - name: Check the live Worker
        env:
          AUDIO_CHECK_URL: ${{ vars.AUDIO_CHECK_URL || 'https://media.zaideih.com/audio/1' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' -H 'Range: bytes=0-1' "$AUDIO_CHECK_URL" || echo 000)
            case "$status" in
              206)
                if grep -qi '^x-zaideih-meta:' headers.txt; then
                  echo "$AUDIO_CHECK_URL answers 206 with $(grep -i '^x-zaideih-meta:' headers.txt | tr -d '\r')"
                  exit 0
                fi
                echo "attempt $attempt: 206 without X-Zaideih-Meta; the new version may not be live yet" ;;
              4??)
                echo "::error::$AUDIO_CHECK_URL answered HTTP $status. The deploy itself succeeded; check the track id, D1 and R2 (node tools/diagnose.mjs track <id> --probe), or bot protection."
                exit 1 ;;
              *)
                echo "attempt $attempt: HTTP $status" ;;
            esac
            sleep 10
          done
          echo "::error::$AUDIO_CHECK_URL did not answer as expected within a minute (last answer: HTTP $status)"
          exit 1

  # ----------------------------------------------------------------- d1 ----

  # Loads every track path from assets/data/media.json into D1 as upserts.
  # Rows for tracks no longer in media.json stay; removing them is a manual
  # step (node tools/media.mjs d1 --prune --apply) so a release never deletes.
  d1:
    needs: [plan, test]
    if: needs.plan.outputs.d1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: audio
    steps:
      - name: Require the Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] || { echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set; see docs/releasing.md"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/media.mjs d1 --apply
      - name: Load the paths into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" d1 execute audio --remote --yes --file build/d1/tracks.sql --config worker/media/wrangler.toml

  # ------------------------------------------------------------ release ----

  # Tags the released commit and publishes the CHANGELOG.md section as a
  # GitHub release, once every planned deploy has succeeded. A tag that
  # already exists on this commit (a re-run) is left as it is; on another
  # commit it stops the job, since a version names one commit.
  publish:
    needs: [plan, web, audio, d1]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.web.result == 'success' || needs.audio.result == 'success' || needs.d1.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
          WEB: ${{ needs.web.result }}
          AUDIO: ${{ needs.audio.result }}
          D1: ${{ needs.d1.result }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG already names commit $existing, not $GITHUB_SHA; bump the version (node tools/version.mjs --apply)"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG exists already (a re-run); left as it is"
            exit 0
          fi
          released=""
          [ "$WEB" = "success" ] && released="$released web"
          [ "$AUDIO" = "success" ] && released="$released audio"
          [ "$D1" = "success" ] && released="$released d1"
          printf '%s\n\nReleased:%s\n' "$NOTES" "$released" > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
