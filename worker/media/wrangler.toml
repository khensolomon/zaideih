# Audio Worker: serves https://media.zaideih.com/audio/:id from R2.
#
# Released by .github/workflows/release.yml ("release: audio"), which applies
# the schema before deploying. By hand, from the repository root, in this order:
#   node tools/d1.mjs schema --apply
#   npx wrangler deploy --config worker/media/wrangler.toml
#
# The D1 database (schema.sql, plus migrations/ for columns added later):
#   node tools/d1.mjs status                       tables and row counts
#   node tools/d1.mjs schema --apply               create what is missing, keep data
#   node tools/d1.mjs tracks --apply               load track paths from assets/data/media.json
#   node tools/d1.mjs reset --keep-plays --apply   drop every table, recreate, reload

name = "media"
main = "script.js"
compatibility_date = "2026-05-01"

# The address media.zaideih.com is a custom domain attached in the Cloudflare
# dashboard (Workers & Pages, media, Settings, Domains & Routes), not here: a
# route in this file makes every deploy look up the zaideih.com zone, which
# would need zone permissions on the release workflow's token. Deploys leave
# the attached domain as it is. See docs/worker-audio.md.
# No workers.dev address or preview URLs: audio is served only at media.zaideih.com.
workers_dev = false
preview_urls = false

[vars]
# Origins allowed to download audio with fetch() for offline play (CORS).
# app://zaideih is the desktop app; localhost entries are for local testing.
ALLOWED_ORIGINS = "https://zaideih.com,https://beta.zaideih.com,app://zaideih,http://localhost:8080,http://127.0.0.1:8080"
# Part of the edge-cache key for track lookups (cached 24 hours per data
# centre). Change it and redeploy to drop every cached lookup, e.g. after
# correcting paths in D1.
META_CACHE_VERSION = "1"
# Origins whose song plays are counted (POST /plays): the released app only,
# so plays while testing locally never count.
PLAY_ORIGINS = "https://zaideih.com,https://beta.zaideih.com,app://zaideih"
# Sign in with GitHub for the Workspace (auth.js): the GitHub App "Zaideih"
# (App ID 5427707). The client secret is a Worker secret:
#   npx wrangler secret put GITHUB_CLIENT_SECRET --config worker/media/wrangler.toml
# The App's callback URL is https://media.zaideih.com/auth/callback.
GITHUB_CLIENT_ID = "Iv23liaAXdaeZkJbwN27"
# Pages that may sign in; the Worker redirects back to these origins only.
AUTH_ORIGINS = "https://zaideih.com,https://beta.zaideih.com,http://localhost:8080,http://127.0.0.1:8080"
# The repository the App is installed on. Suggestions from people without
# write access are opened there as pull requests by the App (suggest.js),
# with its private key as the Worker secret GITHUB_APP_KEY (PKCS#8 PEM).
GITHUB_REPO = "khensolomon/zaideih"
# Zaideih's owner (docs/accounts.md): the member signed in with this GitHub
# account holds every right. The numeric id, since a login can be renamed
# and then taken by someone else (GET /repos/khensolomon/zaideih: owner.id).
OWNER_GITHUB_ID = "1753766"
# Sign in with Google (google.js, docs/setup.md#google-sign-in): the OAuth
# client's id (public, Google Cloud project Zaideih); its secret is the
# Worker secret GOOGLE_CLIENT_SECRET.
# Without both, Google sign-in answers 503 naming what is missing.
GOOGLE_CLIENT_ID = "224047921042-duk7gtk37l28vukhr39fc8k6b4rrmtjt.apps.googleusercontent.com"
# Personal libraries (library.js, docs/library.md): at most 95 MB per file
# (a Worker request body may be 100 MB on the Free and Pro plans) and 2 GB
# per member; the owner has no limit. Streaming addresses are signed with
# the Worker secret AUDIO_SIGNING_KEY:
#   openssl rand -base64 32 | npx wrangler secret put AUDIO_SIGNING_KEY --config worker/media/wrangler.toml
UPLOAD_MAX_BYTES = "95000000"
UPLOAD_QUOTA_BYTES = "2000000000"

[[d1_databases]]
binding = "DB"
database_name = "audio"
database_id = "c9498604-47df-4dc9-b15c-357f5cb893ba"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "media"

# Housekeeping once a day, 03:17 UTC (script.js scheduled, housekeeping.js): released
# requests settled, half-done uploads, old invites, challenges and run-out sessions removed.
[triggers]
crons = ["17 3 * * *"]

# Rate limits for POST /plays, keyed per sender address (see script.js).
# namespace_id must be unique within the Cloudflare account.
[[ratelimits]]
name = "PLAYS_LIMIT"
namespace_id = "4201"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "TRACK_LIMIT"
namespace_id = "4202"
simple = { limit = 1, period = 60 }

# Suggestions (POST /auth/suggest), keyed per GitHub user: at most 2 a minute.
[[ratelimits]]
name = "SUGGEST_LIMIT"
namespace_id = "4203"
simple = { limit = 2, period = 60 }

# Uploads to personal libraries (POST /library/uploads), keyed per GitHub user.
[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "4204"
simple = { limit = 30, period = 60 }

# Passkey sign-in challenges (POST /auth/passkey/options {kind: "get"}, no sign-in needed), keyed
# per sender address: each writes a D1 row, so a loop must not spend the day's writes.
[[ratelimits]]
name = "PASSKEY_LIMIT"
namespace_id = "4205"
simple = { limit = 10, period = 60 }
