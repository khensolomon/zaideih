# Audio Worker: serves https://media.zaideih.com/audio/:id from R2.
#
# Deploy from the repository root:
#   npx wrangler deploy --config worker/media/wrangler.toml
#
# Load or refresh track paths (from assets/data/media.json):
#   node tools/media.mjs d1 --apply
#   npx wrangler d1 execute audio --remote --file build/d1/tracks.sql --config worker/media/wrangler.toml

name = "media"
main = "script.js"
compatibility_date = "2026-05-01"

[vars]
# Origins allowed to download audio with fetch() for offline play (CORS).
# app://zaideih is the desktop app; localhost entries are for local testing.
ALLOWED_ORIGINS = "https://zaideih.com,https://www.zaideih.com,app://zaideih,http://localhost:8080,http://127.0.0.1:8080"

[[d1_databases]]
binding = "DB"
database_name = "audio"
database_id = "c9498604-47df-4dc9-b15c-357f5cb893ba"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "media"

[[routes]]
pattern = "media.zaideih.com"
custom_domain = true
