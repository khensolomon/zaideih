# Audio Worker: serves https://media.zaideih.com/audio/:id from R2.
#
# Deploy from the repository root:
#   npx wrangler deploy --config worker/media/wrangler.toml
#
# The D1 database (schema in schema.sql, no migrations), from the repository root:
#   node tools/d1.mjs status                       tables and row counts
#   node tools/d1.mjs schema --apply               create what is missing, keep data
#   node tools/d1.mjs tracks --apply               load track paths from assets/data/media.json
#   node tools/d1.mjs reset --keep-plays --apply   drop every table, recreate, reload

name = "media"
main = "script.js"
compatibility_date = "2026-05-01"

# The address media.zaideih.com is a custom domain attached in the Cloudflare
# dashboard (Workers & Pages, media, Settings, Domains & Routes), not here: a
# route in this file makes every deploy look up the zaideih.com zone, which
# would need zone permissions on the release workflow's token. Deploys leave
# the attached domain as it is. See docs/worker-audio.md.
# No workers.dev address or preview URLs: audio is served only at media.zaideih.com.
workers_dev = false
preview_urls = false

[vars]
# Origins allowed to download audio with fetch() for offline play (CORS).
# app://zaideih is the desktop app; localhost entries are for local testing.
ALLOWED_ORIGINS = "https://zaideih.com,https://beta.zaideih.com,app://zaideih,http://localhost:8080,http://127.0.0.1:8080"
# Part of the edge-cache key for track lookups (cached 24 hours per data
# centre). Change it and redeploy to drop every cached lookup, e.g. after
# correcting paths in D1.
META_CACHE_VERSION = "1"
# Origins whose song plays are counted (POST /plays): the released app only,
# so plays while testing locally never count.
PLAY_ORIGINS = "https://zaideih.com,https://beta.zaideih.com,app://zaideih"
# Sign in with GitHub for the admin page (auth.js): the GitHub App "Zaideih"
# (App ID 5427707). The client secret is a Worker secret:
#   npx wrangler secret put GITHUB_CLIENT_SECRET --config worker/media/wrangler.toml
# The App's callback URL is https://media.zaideih.com/auth/callback.
GITHUB_CLIENT_ID = "Iv23liaAXdaeZkJbwN27"
# Pages that may sign in; the Worker redirects back to these origins only.
AUTH_ORIGINS = "https://zaideih.com,https://beta.zaideih.com,http://localhost:8080,http://127.0.0.1:8080"

[[d1_databases]]
binding = "DB"
database_name = "audio"
database_id = "c9498604-47df-4dc9-b15c-357f5cb893ba"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "media"

# Rate limits for POST /plays, keyed per sender address (see script.js).
# namespace_id must be unique within the Cloudflare account.
[[ratelimits]]
name = "PLAYS_LIMIT"
namespace_id = "4201"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "TRACK_LIMIT"
namespace_id = "4202"
simple = { limit = 1, period = 60 }
