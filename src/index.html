<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Zaideih</title>
	<meta name="description" content="Zaideih music station: Zola, Myanmar, Mizo and Falam music that keeps playing offline.">
	<!--%HEAD%-->
	<link rel="stylesheet" href="%CSS%">
</head>
<body>
	<div class="shell">
		<header class="navbar">
			<div class="nav-left">
				<a class="nav-home" href="#/" data-nav-home aria-label="Zaideih, home"><span class="logo-tile" data-logo></span></a>
				<button class="nav-back" data-act="back" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg><span>Back</span></button>
			</div>
			<div class="nav-title" id="nav-title" aria-hidden="true"></div>
			<div class="nav-right">
				<small class="offline-pill" data-offline hidden>Offline</small>
				<a class="icon-btn" href="#/search" data-nav="search" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
				<a class="icon-btn" href="#/library" data-nav="library" aria-label="Library"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M9 4v16M14 4l6 16"/></svg></a>
			</div>
		</header>

		<aside class="rail" aria-label="Navigation">
			<div class="brand"><a class="logo-link" href="#/" aria-label="Zaideih, home"><span class="logo-tile" data-logo></span></a> <small class="offline-pill" data-offline hidden>Offline</small></div>
			<nav>
				<a href="#/" data-nav="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
				<a href="#/search" data-nav="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
				<a href="#/library" data-nav="library"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M9 4v16M14 4l6 16"/></svg>Library</a>
			</nav>
			<div>
				<h2>Languages</h2>
				<div class="langs" id="rail-langs"></div>
			</div>
			<div>
				<h2>Browse</h2>
				<div class="langs"><a href="#/genres"><span>Genres</span></a><a href="#/top"><span>Most played</span></a></div>
			</div>
			<footer class="rail-foot"><a href="#/about" data-nav="about">About</a><a href="#/terms" data-nav="terms">Terms</a><a href="#/help" data-nav="help">Help</a></footer>
		</aside>

		<main id="view" tabindex="-1">
			<p class="muted" style="padding-top:20vh;text-align:center">Loading the music catalog…</p>
		</main>

		<footer class="bar idle" id="bar" aria-label="Player">
			<canvas class="viz" data-viz="deck" aria-hidden="true"></canvas>
			<div class="progress" aria-hidden="true"><span id="bar-progress"></span></div>
			<button class="now" id="bar-now" aria-label="Open now playing"></button>
			<div class="middle">
				<div class="ctl">
					<button class="icon-btn wide" data-ctl="shuffle" aria-label="Shuffle" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2 0 3 1 4.2 2.8l2.6 4.4C14.5 16 15.5 17 17.5 17H21M3 17h3.5c1.3 0 2.2-.5 3-1.4M14.5 8.4c.8-.9 1.7-1.4 3-1.4H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
					<button class="icon-btn wide" data-ctl="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14L9 12zM6 5v14"/></svg></button>
					<button class="play-btn" data-ctl="toggle" aria-label="Play"></button>
					<button class="icon-btn" data-ctl="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l10-7zM18 5v14"/></svg></button>
					<button class="icon-btn wide" data-ctl="repeat" aria-label="Repeat"></button>
				</div>
				<div class="seek">
					<span class="time" data-time="pos">0:00</span>
					<input type="range" data-ctl="seek" min="0" max="0" step="1" value="0" aria-label="Seek">
					<span class="seek-tip" hidden></span>
					<span class="time" data-time="dur">0:00</span>
				</div>
			</div>
			<div class="side">
				<button class="icon-btn like" id="bar-like" aria-label="Like this song" aria-pressed="false" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-9-9.4C2 7.2 4.2 4.5 7.2 4.5c2 0 3.5 1.1 4.8 2.8 1.3-1.7 2.8-2.8 4.8-2.8 3 0 5.2 2.7 4.2 6.1C19.5 15.4 12 20 12 20z"/></svg></button>
				<div class="volume">
					<button class="icon-btn" data-ctl="mute" aria-label="Mute"></button>
					<input type="range" data-ctl="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
				</div>
				<button class="icon-btn wide" data-act="open-sheet" aria-label="Show queue"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8M17 15v6l4-3z"/></svg></button>
			</div>
		</footer>

	</div>

	<section class="sheet" id="sheet" aria-label="Now playing" hidden></section>
	<dialog id="dialog"></dialog>
	<div class="toasts" id="toasts" aria-live="polite"></div>

	<noscript><p class="fatal">Zaideih needs JavaScript to play music.</p></noscript>
	<script type="module" src="%JS%"></script>
</body>
</html>
